spring.application.name=demo

server.port=${PORT:8080}
server.address=0.0.0.0

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/studio_ai_db?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

# Optional external provider for real try-on:
# ai.tryon.real-url=https://your-tryon-provider.example/api/try-on
spring.mail.host=smtp.gmail.com
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#openrouter.api.key=${OPENROUTER_API_KEY:}
#openrouter.api.url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:}
CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:}
CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:}
